<!DOCTYPE html>
<html>
<head>
<style>
  img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 100%;
  max-height: 100vh;
  z-index: -1;
}
  
    

h1{
  text-align: center;
}
p{
  text-align: center;
}
</style>
</head>
<body>

<h1>This is a heading</h1>
<img src="tree.jpeg">
<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
